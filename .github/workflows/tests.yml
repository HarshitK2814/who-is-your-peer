name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e qcore -e ".[dev,v2]"
      - name: Test
        # tests use synthetic data only; anything that needs data/ (git-ignored) must skip itself
        run: pytest -q
